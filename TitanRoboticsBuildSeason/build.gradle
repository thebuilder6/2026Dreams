plugins {
    id "java"
    id "edu.wpi.first.GradleRIO" version "2026.2.1"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

def ROBOT_MAIN_CLASS = "frc.robot.Main"

// Define my targets (RoboRIO) and artifacts (deployable files)
// This is added by GradleRIO's backing project DeployUtils.
deploy {
    targets {
        roborio(getTargetTypeClass('RoboRIO')) {
            // Team number is loaded either from the .wpilib/wpilib_preferences.json
            // or from command line. If not found an exception will be thrown.
            // You can use getTeamOrDefault(team) instead of getTeamNumber if you
            // want to store a team number in this file.
            team = project.frc.getTeamNumber()
            debug = project.frc.getDebugOrDefault(false)

            artifacts {
                // First part is artifact name, 2nd is artifact type
                // getTargetTypeClass is a shortcut to get the class type using a string

                frcJava(getArtifactTypeClass('FRCJavaArtifact')) {
                }

                // Static files artifact
                frcStaticFileDeploy(getArtifactTypeClass('FileTreeArtifact')) {
                    files = project.fileTree('src/main/deploy')
                    directory = '/home/lvuser/deploy'
                    deleteOldFiles = false // Change to true to delete files on roboRIO that no
                                           // longer exist in deploy directory of this project
                }
            }
        }
    }
}

def deployArtifact = deploy.targets.roborio.artifacts.frcJava

// Set to true to use debug for all targets including JNI, which will drastically impact
// performance.
wpi.java.debugJni = false

// Set this to true to enable desktop support.
def includeDesktopSupport = true

// Defining my dependencies. In this case, WPILib (+ friends), and vendor libraries.
// Also defines JUnit 5.
dependencies {
    if (file("lib/akit-autolog-26.0.2.jar").exists()) {
        annotationProcessor files('lib/akit-autolog-26.0.2.jar', 'lib/javapoet-1.13.0.jar')
    } else {
        def akitJson = new groovy.json.JsonSlurper().parseText(new File(projectDir.getAbsolutePath() + "/vendordeps/AdvantageKit.json").text)
        annotationProcessor "org.littletonrobotics.akit:akit-autolog:${akitJson.version}"
    }
    annotationProcessor wpi.java.deps.wpilibAnnotations()
    implementation wpi.java.deps.wpilib()
    implementation wpi.java.vendor.java()

    roborioDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.roborio)
    roborioDebug wpi.java.vendor.jniDebug(wpi.platforms.roborio)

    roborioRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.roborio)
    roborioRelease wpi.java.vendor.jniRelease(wpi.platforms.roborio)

    nativeDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.desktop)
    nativeDebug wpi.java.vendor.jniDebug(wpi.platforms.desktop)
    simulationDebug wpi.sim.enableDebug()

    nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)
    nativeRelease wpi.java.vendor.jniRelease(wpi.platforms.desktop)
    simulationRelease wpi.sim.enableRelease()

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
    forkEvery = 1





}

// Simulation configuration (e.g. environment variables).
def guiExtension = wpi.sim.addGui()
guiExtension.defaultEnabled = true
// Headless AI-vs-AI training matches: -Pheadless runs with no SimGUI window
// (HeadlessMatchDriver sequences the DS itself) plus headless system
// properties on the sim JVM. The GradleRIO `simulateJava` task is an
// aggregate DefaultTask; the real JavaExec tasks are simulateJavaDebug and
// simulateJavaRelease (JavaSimulationTask), so both are configured here.
//   .\gradlew simulateJavaRelease --offline -Pheadless [-Pseed=2026] [-PdurationSec=150]
//   [-PautoSec=15] [-PdisabledGapSec=3] [-PbootWaitSec=8] [-PfieldFuelCount=108] [-PlogDir=logs] [-PreportDir=reports]
// Replay the resulting .wpilog in AdvantageScope (File -> Open Log).
if (project.hasProperty('headless')) {
    guiExtension.defaultEnabled = false
    for (String simTaskName : ['simulateJavaDebug', 'simulateJavaRelease']) {
        tasks.matching { it.name == simTaskName }.configureEach {
            systemProperty 'frc.headless', 'true'
            // Opt-in Jev shift clock (frc.jev.realShiftClock). Still OFF by
            // default, but for a narrower reason than before.
            //
            // The old justification was "a real timeUntilHubShift lets
            // STAGE_STANDOFF outrank VACUUM_MIDFIELD, and the measured result
            // was Blue scoring ZERO in teleop", which implied the staging
            // constants were wrong. They are not: with a working clock, staging
            // (0.95) beating vacuum (0.92) inside the 3.5s window is correct
            // behaviour, and mid-shift vacuum still wins. Pinned by
            // JevDecisionEngineTest.testStagingBeatsHarvestingOnlyNearShiftBoundary.
            // No constant retune is warranted.
            //
            // What actually blocked the flip was that the measurement behind it
            // was confounded -- it predates the training-archetype override (Blue
            // had no defender at all), the per-bot fuel attribution leak, and the
            // Common Random Numbers work, and a single run of a sim that is
            // low-variance-not-reproducible cannot settle this. Re-measure with
            // tools/score/sweep.ps1 (>=5 seeds x >=2 replicas) on the current
            // binary, then flip.
            systemProperty 'frc.jev.realShiftClock',
                    project.hasProperty('realShiftClock') ? 'true' : 'false'
            for (String key : ['seed', 'durationSec', 'autoSec', 'disabledGapSec',
                               'bootWaitSec', 'fieldFuelCount', 'logDir', 'reportDir',
                               'resultJsonl', 'variant', 'replica']) {
                if (project.hasProperty(key)) {
                    systemProperty "frc.headless.${key}", "${project.property(key)}"
                }
            }
            // Diagnostic only: pins every Jev agent to one objective so a headless
            // match can be run twice to test whether non-reproducibility comes from
            // the AI or from unseeded physics. See KNOWN_ISSUES.md section A.
            if (project.hasProperty('freezeObjective')) {
                systemProperty 'frc.jev.freezeObjective',
                        "${project.property('freezeObjective')}"
            }
        }
    }
}
def dsExt = wpi.sim.addDriverstation()
// Opt-in real Driver Station (halsim_ds_socket, "Use Real DriverStation"):
// .\gradlew simulateJava -PrealDs. Default off so plain runs keep SimGUI DS.
// The VS Code "Pick extensions to run" popup toggles the same extension.
if (project.hasProperty('realDs')) {
    dsExt.defaultEnabled = true
}

// Setting up my Jar File. In this case, adding all libraries into the main jar ('fat jar')
// in order to make them all available at runtime. Also adding the manifest so WPILib
// knows where to look for our Robot Class.
jar {
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    from('src') { into 'backup/src' }
    from('vendordeps') { into 'backup/vendordeps' }
    from('build.gradle') { into 'backup' }
    manifest edu.wpi.first.gradlerio.GradleRIOPlugin.javaManifest(ROBOT_MAIN_CLASS)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Configure jar and deploy tasks
deployArtifact.jarTask = jar
wpi.java.configureExecutableTasks(jar)
wpi.java.configureTestTasks(test)

// ---------------------------------------------------------------------------
// Score measurement rig: dump the exact JVM launch recipe for a headless match.
//
// tools/score/sweep.ps1 runs N headless matches in parallel by spawning raw
// `java` processes. Hand-assembling the classpath or hardcoding build/jni breaks
// the moment GradleRIO changes either, and a missing -Djava.library.path fails
// every worker with UnsatisfiedLinkError on wpiHaljni / wpimathjni / dyn4j.
// Reflecting over the real simulateJavaRelease JavaExec makes the Gradle
// definition the single source of truth, so the sweep can never drift from what
// `./gradlew simulateJavaRelease` actually does. It also carries the
// frc.headless.* system properties through, so new headless options stop needing
// manual forwarding in two places.
//
//   .\gradlew dumpSimLaunch --offline
//   -> build/simlaunch.properties
// ---------------------------------------------------------------------------
tasks.register('dumpSimLaunch') {
    // Deliberately does NOT depend on simulateJavaRelease: that task *executes*
    // the sim, and doing so just to read its configuration would launch a second
    // sim JVM that fights the caller for CameraServer/phoenix ports 1181-1182
    // and 1250. Reading a task's properties does not run it. `jar` (not `classes`)
    // because the sim task's classpath is the fat jar, which must exist and be
    // current on disk before the sweep spawns workers against it.
    dependsOn 'jar'
    doLast {
        def simTask = tasks.getByName('simulateJavaRelease')
        def out = new File(project.layout.buildDirectory.get().asFile, 'simlaunch.properties')
        out.parentFile.mkdirs()

        // GradleRIO passes the native library path lazily through
        // jvmArgumentProviders, so plain `jvmArgs` reads empty. Resolve the
        // providers, or a raw `java -cp` launch dies with UnsatisfiedLinkError on
        // wpiHaljni / wpimathjni / dyn4j.
        def jvmArgs = []
        try { jvmArgs.addAll(simTask.jvmArgs.collect { it.toString() }) } catch (Exception ignored) { }
        try {
            simTask.jvmArgumentProviders.each { provider ->
                provider.asArguments().each { jvmArgs << it.toString() }
            }
        } catch (Exception ignored) { }
        if (!jvmArgs.any { it.contains('java.library.path') }) {
            // Fallback for when the providers are not resolvable at this point.
            // extractReleaseNative always lands here for the release sim task.
            def jni = new File(project.layout.buildDirectory.get().asFile, 'jni/release')
            if (jni.isDirectory()) {
                jvmArgs << "-Djava.library.path=${jni.absolutePath}".toString()
            }
        }
        // -Djava.library.path alone is NOT sufficient. WPILib's HAL_LoadExtension
        // goes through the OS loader (LoadLibrary), which searches PATH, not the
        // JVM's library path. Without this the raw launch dies at
        // "Unable to find wpi driver binary" and then hard-crashes the JVM with
        // EXCEPTION_UNCAUGHT_CXX_EXCEPTION, even though every native
        // (wpiHal.dll, wpiHaljni.dll, halsim_*.dll) is sitting right there.
        def jniDir = new File(project.layout.buildDirectory.get().asFile, 'jni/release')
        def pathPrefix = jniDir.isDirectory() ? jniDir.absolutePath : ''

        def sysProps = [:]
        if (simTask.hasProperty('systemProperties')) {
            simTask.systemProperties.each { k, v -> sysProps[k.toString()] = v.toString() }
        }
        def envVars = [:]
        if (simTask.hasProperty('environmentVariables')) {
            try { simTask.environmentVariables.each { k, v -> envVars[k.toString()] = v.toString() } }
            catch (Exception ignored) { }
        }
        // GradleRIO populates mainClass lazily, so it has no value at
        // configuration-read time. Fall back to the project's declared main.
        def mainClassName = ROBOT_MAIN_CLASS
        try {
            if (simTask.hasProperty('mainClass')) { mainClassName = simTask.mainClass.get() }
        } catch (Exception ignored) { }
        def lines = [
                "# Generated by :dumpSimLaunch - do not edit.",
                "# Single source of truth: reflects the simulateJavaRelease JavaExec.",
                "classpath=${simTask.classpath.asPath}",
                "jvmArgs=" + jvmArgs.join(' '),
                "pathPrefix=${pathPrefix}",
                "mainClass=${mainClassName}",
        ]
        sysProps.each { k, v -> lines << "sysProp.${k}=${v}" }
        envVars.each { k, v -> lines << "env.${k}=${v}" }
        out.text = lines.join('\n') + '\n'
        logger.lifecycle("dumpSimLaunch -> ${out}")
    }
}

// Configure string concat to always inline compile
tasks.withType(JavaCompile) {
    options.compilerArgs.add '-XDstringConcat=inline'
}

task(replayWatch, type: JavaExec) {
    mainClass = "org.littletonrobotics.junction.ReplayWatch"
    classpath = sourceSets.main.runtimeClasspath
}

// Automatically generate BuildConstants.java and deploy/git_info.json containing Git & build metadata
task generateBuildConstants {
    def buildConstantsFile = file("src/main/java/frc/robot/BuildConstants.java")
    def deployJson = file("src/main/deploy/git_info.json")

    // A truncated generated file must never look up to date. The previous check
    // was `exists() && exists()`, so a build killed mid-write left a half-written
    // source file that every later build skipped -- and it reads as a compile
    // error with no obvious cause. The `outToDateWhen` trap flagged in
    // KNOWN_ISSUES.md ("an interrupted generateBuildConstants leaves a
    // half-written BuildConstants.java") was this, not a Gradle bug.
    // These are structural sentinels, not a parse: both files are generated, so
    // their first and last meaningful lines are fixed.
    def buildConstantsIntact = { f ->
        if (!f.exists()) return false
        def t = f.getText("UTF-8").trim()
        t.contains("public final class BuildConstants") && t.endsWith("}")
    }
    def deployJsonIntact = { f ->
        if (!f.exists()) return false
        def t = f.getText("UTF-8").trim()
        t.startsWith("{") && t.endsWith("}")
    }

    outputs.file buildConstantsFile
    outputs.file deployJson
    outputs.upToDateWhen { buildConstantsIntact(buildConstantsFile) && deployJsonIntact(deployJson) }

    doLast {
        def getGitCmd = { cmd ->
            try {
                def proc = cmd.execute(null, projectDir)
                def stdout = new StringBuilder()
                def stderr = new StringBuilder()
                proc.consumeProcessOutput(stdout, stderr)
                proc.waitForOrKill(5000)
                if (proc.exitValue() == 0) {
                    return stdout.toString().trim()
                }
            } catch (Exception ignored) {}
            return "unknown"
        }

        def gitSha = getGitCmd('git rev-parse --short HEAD')
        def gitBranch = getGitCmd('git branch --show-current')
        def gitDate = getGitCmd('git log -1 --format=%cd --date=iso')
        def dirtyStatus = getGitCmd('git status --porcelain')
        def isDirty = (dirtyStatus != "unknown" && !dirtyStatus.isEmpty()) ? 1 : 0
        def buildDate = new java.text.SimpleDateFormat("yyyy-MM-dd HH:mm:ss z").format(new Date())
        def robotName = "TitanRobotics2026"

        // Atomic replace. `target.text = ...` truncates in place, so ANY
        // interruption (a stray taskkill, a killed agent session, a full disk)
        // leaves a partial file in src/main/java. Write a sibling temp file and
        // make one atomic move instead: the target is either the old content or
        // the new content, never a prefix of it.
        def writeAtomic = { File target, String content ->
            target.parentFile.mkdirs()
            def tmp = new File(target.parentFile, target.name + ".tmp")
            try {
                tmp.setText(content, "UTF-8")
                try {
                    java.nio.file.Files.move(
                        tmp.toPath(), target.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING,
                        java.nio.file.StandardCopyOption.ATOMIC_MOVE)
                } catch (java.nio.file.AtomicMoveNotSupportedException ignored) {
                    // Some network / AV-backed filesystems refuse ATOMIC_MOVE.
                    // REPLACE_EXISTING is still a single operation rather than an
                    // in-place truncate, so it degrades rather than breaking.
                    java.nio.file.Files.move(
                        tmp.toPath(), target.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                }
            } finally {
                if (tmp.exists()) { tmp.delete() }
            }
        }

        writeAtomic(buildConstantsFile, """package frc.robot;

/**
 * Automatically generated file containing build and git version information.
 * Generated by GradleRIO deploy metadata task.
 */
public final class BuildConstants {
    public static final String ROBOT_NAME = "${robotName}";
    public static final String GIT_SHA = "${gitSha}";
    public static final String GIT_BRANCH = "${gitBranch}";
    public static final String GIT_DATE = "${gitDate}";
    public static final String BUILD_DATE = "${buildDate}";
    public static final int DIRTY = ${isDirty};

    private BuildConstants() {}
}
""")

        writeAtomic(deployJson, """{
  "robotName": "${robotName}",
  "gitSha": "${gitSha}",
  "gitBranch": "${gitBranch}",
  "gitDate": "${gitDate}",
  "buildDate": "${buildDate}",
  "dirty": ${isDirty}
}
""")
    }
}

compileJava.dependsOn generateBuildConstants
